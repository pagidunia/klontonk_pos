<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0060AF" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0A1628" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Klontonk POS â€” Sistem Point of Sales modern untuk bisnis multi-cabang" />
  <!-- Content Security Policy:
       - script: diri sendiri + hash script Live Server (dev hot-reload)
       - connect: ws/wss untuk websocket Live Server
       - 'frame-ancestors' dihapus (tidak valid via <meta>) -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'sha256-vvt4KWwuNr51XfE5m+hzeNEGhiOfZzG97ccfqGsPwvE='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' ws: wss:; base-uri 'self'; form-action 'self'" />
  
  <title>Klontonk POS</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  
  <!-- ============ APP SHELL ============ -->
  <div id="app" class="app-shell">
    
    <!-- HEADER -->
    <header class="app-header" role="banner">
      <button 
        class="icon-btn burger-btn" 
        id="accountBtn" 
        aria-label="Menu akun"
        aria-controls="bottomNav">
        <span class="burger-line"></span>
        <span class="burger-line"></span>
        <span class="burger-line"></span>
      </button>
      
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">K</div>
        <div class="brand-text">
          <h1 class="brand-name">Klontonk</h1>
          <span class="brand-tag">POS</span>
        </div>
      </div>
      
      <div class="header-actions">
        <button 
          class="tenant-chip" 
          id="tenantChip" 
          aria-label="Ganti tenant"
          title="Ganti tenant">
          <span class="tenant-dot"></span>
          <span class="tenant-name" id="tenantName">Toko Pusat</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
        
        <button 
          class="icon-btn theme-toggle" 
          id="themeToggle" 
          aria-label="Ganti mode gelap/terang">
          <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
          </svg>
          <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </header>
    
    <!-- BOTTOM NAVIGATION (pengganti drawer) -->
    <nav class="bottom-nav" id="bottomNav" role="navigation" aria-label="Navigasi utama">
      <button class="bottom-tab" data-tab="beranda" data-route="/beranda" aria-label="Beranda">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        <span>Beranda</span>
      </button>
      <button class="bottom-tab" data-tab="stok" aria-label="Stok">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
        <span>Stok</span>
      </button>
      <button class="bottom-tab accent" data-tab="transaksi" data-route="/kasir" aria-label="Transaksi">
        <span class="tab-orb">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
        </span>
        <span>Transaksi</span>
      </button>
      <button class="bottom-tab" data-tab="laporan" data-route="/laporan-kasir" aria-label="Laporan">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
        <span>Laporan</span>
      </button>
      <button class="bottom-tab" data-tab="lainnya" aria-label="Lainnya">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
        <span>Lainnya</span>
      </button>
    </nav>
    <!-- MAIN CONTENT -->
    <main class="app-main" id="appMain" role="main">
      <!-- Konten dirender oleh router -->
    </main>
    
  </div>
  
  <!-- ============ CUSTOM MODAL CONTAINER ============ -->
  <div id="modalRoot" class="modal-root" aria-hidden="true"></div>
  
  <!-- ============ TOAST CONTAINER ============ -->
  <div id="toastRoot" class="toast-root" aria-live="polite" aria-atomic="true"></div>
  
  <!-- ============ BOTTOM SHEET CONTAINER ============ -->
  <div id="sheetRoot" class="sheet-root" aria-hidden="true"></div>
  
  <!-- ============ SCRIPTS ============ -->
  <!-- v1.1.0: cache-busting â€” naikkan versi setiap rilis -->
  <script type="module" src="js/app.js?v=1.1.0"></script>
</body>
</html>
