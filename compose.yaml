# Jalankan:  podman compose up -d      Hentikan:  podman compose down
# Hanya menyajikan file statis di http://localhost:8080 (localhost dianggap aman oleh browser, jadi kamera scan jalan).
services:
  pos:
    image: public.ecr.aws/nginx/nginx:alpine
    container_name: klontonk-pos
    restart: always
    ports:
      # Hanya bisa diakses dari komputer ini.
      - "127.0.0.1:8080:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
